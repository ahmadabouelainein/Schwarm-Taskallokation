# config.yaml

# rectangular area bounds
area_bounds:
  x_min: 0
  x_max: 100
  y_min: 0
  y_max: 50

# number of robots in swarm
n_robots: 7

# per-robot exploration radius
radius: 5.0

# turn penalty coefficient (cost per radian)
turn_coef: 2.0

# repeat/overlap penalty (if used elsewhere)
repeat_penalty: 20.0

ga:
  # genetic algorithm parameters
  pop_size: 1000
  generations: 150
  elite_fraction: 0.2
  mut_rate: 0.05
