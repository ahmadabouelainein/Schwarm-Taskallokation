# config.yaml

# Problem Definition
area_bounds:
  x_min: 0
  x_max: 100
  y_min: 0
  y_max: 50
n_robots: 7
radius: 2.0

# Allocation Params
allocator_type: greedy   # greedy or balanced
start_bound_div: 5         # more condensed area to spawn the robots (1: No condensing, 10: Max condensing)

init_tour_type: nn # nn or serpentine